[project]
name = "baseball-scorer"
version = "0.1.0"
description = "草野球動画から打席タイムラインを生成するスコア収集補助ツール"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "faster-whisper>=1.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.50"]

[project.scripts]
baseball-scorer = "baseball_scorer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
